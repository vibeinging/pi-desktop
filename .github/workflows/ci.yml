name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install all workspaces
        run: npm run setup

      - name: Run quality checks
        run: npm run check

      - name: Build unpacked desktop
        run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Run packaged startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:package

      - name: Run packaged startup smoke
        if: runner.os != 'Linux'
        run: npm run smoke:package
