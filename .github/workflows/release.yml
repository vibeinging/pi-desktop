name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  preflight:
    name: Verify merged and regressed commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify tag version
        run: node scripts/verify-release.mjs

      - name: Verify commit is merged and regressed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          git fetch origin main:refs/remotes/origin/main --no-tags

          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::Tag commit $tag_sha is not contained in origin/main. Merge it before tagging."
            exit 1
          fi

          ci_run_id="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$tag_sha" \
              -f event=push \
              -f per_page=20 \
              --jq '.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success") | .id' \
              | head -n 1
          )"

          if [ -z "$ci_run_id" ]; then
            echo "::error::No successful main push CI run found for tag commit $tag_sha. Run regression before tagging."
            exit 1
          fi

          {
            echo "Tagged commit: \`$tag_sha\`"
            echo "Main regression: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install all workspaces
        run: npm run setup

      - name: Verify version and signing inputs
        run: npm run release:verify
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || (matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '') }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}

      - name: Build signed release artifacts
        run: npm run package
        env:
          PI_REQUIRE_SIGNING: "1"
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || (matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '') }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app_path="$(find release -type d -name 'PI Desktop.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify Windows signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Windows signature: $($signature.Status)" }

      - name: Generate SBOM
        if: matrix.platform == 'linux'
        run: npm run release:sbom

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
            release/sbom-*.cdx.json

  publish-draft:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify tag version
        run: node scripts/verify-release.mjs

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist

      - name: Add notices and checksums
        shell: bash
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md dist/
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --generate-notes --title "$tag"
          find dist -type f -exec gh release upload "$tag" --clobber {} +
