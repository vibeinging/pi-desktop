appId: io.github.vibeinging.pi-desktop
productName: PI Desktop
electronVersion: 42.4.1
asar: true
npmRebuild: false
afterPack: electron/after-pack.cjs

directories:
  output: release
  buildResources: electron/icons

files:
  - package.json
  - electron/main.js
  - electron/preload.js
  - electron/icons/**/*
  - renderer/dist/**/*

extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: third_party/licenses
    to: third_party/licenses
  - from: staging/server
    to: server
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  icon: electron/icons/icon.icns
  identity: null
  target: dir

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
