<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d2a3a"/>
      <stop offset="1" stop-color="#1a1825"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块背景:缩到 824×824 居中,四周留 100px padding(约 10%),
       避免 macOS Dock 按满铺外缘缩放导致图标比其他应用大一圈。 -->
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#bg)"/>
  <!-- π 字母:在 824×824 内居中。横梁+两腿,端点圆头。 -->
  <g fill="none" stroke="#ffffff" stroke-width="66" stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶部横梁(π 的标志性平顶) -->
    <line x1="328" y1="406" x2="696" y2="406"/>
    <!-- 左腿 -->
    <line x1="392" y1="406" x2="392" y2="660"/>
    <!-- 右腿 -->
    <line x1="632" y1="406" x2="632" y2="660"/>
  </g>
</svg>
